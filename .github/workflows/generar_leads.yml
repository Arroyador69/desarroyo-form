name: 🚀 Sistema de Leads MASIVO - DesArroyo Tech (Rotación Inteligente)

on:
  # Ejecutar cada 6 horas automáticamente con rotación
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas (00:00, 06:00, 12:00, 18:00)
  
  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      ciudad:
        description: 'Ciudad específica (opcional)'
        required: false
        default: ''
      sector:
        description: 'Sector específico (opcional)'
        required: false
        default: ''

jobs:
  rotacion-masiva-leads:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Rotación 1: CIUDADES PRINCIPALES + SECTORES SALUD
        include:
          # BLOQUE 1 - Ciudades principales + Salud/Belleza
          - ciudad: "Madrid"
            sector: "dentistas"
          - ciudad: "Barcelona"  
            sector: "psicologos"
          - ciudad: "Valencia"
            sector: "fisioterapeutas"
          - ciudad: "Sevilla"
            sector: "centros_estetica"
          - ciudad: "Zaragoza"
            sector: "peluquerias"
            
          # BLOQUE 2 - Ciudades medianas + Gastronomía  
          - ciudad: "Málaga"
            sector: "restaurantes"
          - ciudad: "Murcia"
            sector: "cafeterias"
          - ciudad: "Palma"
            sector: "panaderias"
          - ciudad: "Las Palmas"
            sector: "restaurantes"
          - ciudad: "Bilbao"
            sector: "cafeterias"
            
          # BLOQUE 3 - Ciudades pequeñas + Servicios técnicos
          - ciudad: "Alicante"
            sector: "electricistas"
          - ciudad: "Córdoba"
            sector: "fontaneros"
          - ciudad: "Valladolid"
            sector: "electricistas"
          - ciudad: "Vigo"
            sector: "fontaneros"
          - ciudad: "Gijón"
            sector: "electricistas"
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml selenium python-telegram-bot twilio openai python-dotenv
    
    - name: 🔧 Configurar permisos
      run: chmod +x scripts/scraper_gratis.py
    
    - name: 🎯 Ejecutar rotación ${{ matrix.ciudad }} - ${{ matrix.sector }}
      run: |
        echo "🚀 Iniciando: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
        python3 scripts/sistema_leads_avanzado.py "${{ matrix.ciudad }}" "${{ matrix.sector }}"
        echo "✅ Completado: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}

  # EJECUCIÓN ALEATORIA EXTRA (Solo fines de semana para ciudades restantes)
  rotacion-extra:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */6 * * 6,0'  # Solo sábados y domingos
    
    strategy:
      matrix:
        # Ciudades adicionales para fines de semana
        include:
          - ciudad: "Toledo"
            sector: "dentistas"
          - ciudad: "Cáceres" 
            sector: "peluquerias"
          - ciudad: "Badajoz"
            sector: "restaurantes"
          - ciudad: "Cuenca"
            sector: "electricistas"
          - ciudad: "Soria"
            sector: "fontaneros"
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml selenium python-telegram-bot twilio openai python-dotenv
    
    - name: 🎯 Ejecutar rotación extra ${{ matrix.ciudad }} - ${{ matrix.sector }}
      run: python3 scripts/sistema_leads_avanzado.py "${{ matrix.ciudad }}" "${{ matrix.sector }}"
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}

  reporte-general:
    needs: [rotacion-masiva-leads]
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias reporting
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot python-dotenv
    
    - name: 📊 Generar reporte global
      run: python3 scripts/generar_reporte.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: ✅ Notificar ejecución masiva completada
      run: |
        echo "🎉 ROTACIÓN MASIVA COMPLETADA"
        echo "📱 15 ciudades/sectores procesados simultáneamente"
        echo "⏰ Fecha: $(date)"
        echo "🎯 Próxima rotación en 6 horas" 
        echo "💰 Coste estimado: ~11-25€ por rotación"
        echo "📈 Cobertura: 41 ciudades × 60+ sectores = ESPAÑA COMPLETA"
        echo "🚀 ROI esperado: 1 venta Plan Escalable = 1.4 meses cubiertos" 