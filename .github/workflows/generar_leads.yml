name: 🚀 Sistema de Leads WhatsApp Business API - DesArroyo Tech

on:
  # Ejecutar cada 6 horas automáticamente
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas (00:00, 06:00, 12:00, 18:00)
  
  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      ciudad:
        description: 'Ciudad a buscar'
        required: false
        default: 'Madrid'
      sector:
        description: 'Sector a buscar'
        required: false
        default: 'restaurantes'

jobs:
  generar-leads-whatsapp:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias WhatsApp Business API
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml selenium python-telegram-bot twilio openai python-dotenv
    
    - name: 🔧 Configurar permisos
      run: chmod +x scripts/scraper_gratis.py
    
    - name: 📱 WhatsApp Business API - Madrid Restaurantes
      run: python3 scripts/sistema_leads_avanzado.py Madrid restaurantes
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 📱 WhatsApp Business API - Barcelona Peluquerías
      run: python3 scripts/sistema_leads_avanzado.py Barcelona peluquerias
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 📱 WhatsApp Business API - Valencia Dentistas
      run: python3 scripts/sistema_leads_avanzado.py Valencia dentistas
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 📊 Generar reporte WhatsApp leads
      run: python3 scripts/generar_reporte.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: ✅ Notificar ejecución WhatsApp Business API
      run: |
        echo "🎉 WhatsApp Business API ejecutado correctamente"
        echo "📱 Mensajes enviados profesionalmente"
        echo "⏰ Fecha: $(date)"
        echo "🎯 Próxima ejecución en 6 horas" 
        echo "💰 Costo por mensaje: ~$0.025"
        echo "📈 Tasa de apertura: 98%" 