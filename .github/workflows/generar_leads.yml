name: 📞 Sistema de LLAMADAS CONVERSACIONALES - DesArroyo Tech (Demostración Tecnológica)

on:
  # ESTRATEGIA: SOLO LLAMADAS CONVERSACIONALES (Horario Comercial Español)
  schedule:
    # HORARIO COMERCIAL ESPAÑOL COMPLETO: Lunes-Viernes 9:00-14:00 y 16:00-20:00
    - cron: '0 8,9,10,11,12,13 * * 1-5'    # 09:00-14:00 España (Mañana)
    - cron: '0 15,16,17,18,19 * * 1-5'     # 16:00-20:00 España (Tarde)
    # WEEKEND - Volumen reducido (Solo sábados-domingos)
    - cron: '0 11,16 * * 6,0'              # 12:00, 17:00 España (Fin de semana)
  
  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      ciudad:
        description: 'Ciudad específica (opcional)'
        required: false
        default: ''
      sector:
        description: 'Sector específico (opcional)'
        required: false
        default: ''
      tipo_campana:
        description: 'Tipo de campaña'
        required: false
        default: 'HIBRIDO'
        type: choice
        options:
        - LLAMADAS

jobs:
  # ===== LLAMADAS CONVERSACIONALES (DEMOSTRACIÓN TECNOLÓGICA) =====
  llamadas-conversacionales:
    runs-on: ubuntu-latest
    
    strategy:
      max-parallel: 3  # Máximo 3 llamadas simultáneas (horario comercial)
      matrix:
        # PRESUPUESTO AUMENTADO: 300-600€/mes 
        include:
          # BLOQUE 1 - Ciudades principales (Mayor presupuesto)
          - ciudad: "Madrid"
            sector: "dentistas" 
            llamadas_limite: "8"
            presupuesto_max: "25"
          - ciudad: "Barcelona"  
            sector: "restaurantes"
            llamadas_limite: "7"
            presupuesto_max: "22"
          - ciudad: "Valencia"
            sector: "peluquerias"
            llamadas_limite: "6"
            presupuesto_max: "20"
          - ciudad: "Sevilla"
            sector: "abogados"
            llamadas_limite: "6"
            presupuesto_max: "20"
          - ciudad: "Bilbao"
            sector: "psicologos"
            llamadas_limite: "5"
            presupuesto_max: "18"
            
          # BLOQUE 2 - Ciudades medianas  
          - ciudad: "Murcia"
            sector: "fisioterapeutas"
            llamadas_limite: "5"
            presupuesto_max: "18"
          - ciudad: "Zaragoza"
            sector: "centros_estetica"
            llamadas_limite: "4"
            presupuesto_max: "15"
          - ciudad: "Las Palmas"
            sector: "academias_idiomas"
            llamadas_limite: "4"
            presupuesto_max: "15"
          - ciudad: "Palma"
            sector: "gimnasios"
            llamadas_limite: "4"
            presupuesto_max: "15"
          - ciudad: "Vigo"
            sector: "fotografos_locales"
            llamadas_limite: "4"
            presupuesto_max: "15"
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml python-telegram-bot twilio openai python-dotenv vonage
    
    - name: 📞 Ejecutar llamadas conversacionales ${{ matrix.ciudad }} - ${{ matrix.sector }}
      run: |
        echo "📞 LLAMADAS CONVERSACIONALES: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
        echo "🎯 Límite: ${{ matrix.llamadas_limite }} llamadas"
        echo "💰 Presupuesto Máximo: ${{ matrix.presupuesto_max }}€"
        echo "🚀 Demostración tecnológica DesArroyo Tech"
        echo ""
        echo "💬 FLUJO:"
        echo "1️⃣ Llamada personalizada con IA"
        echo "2️⃣ Cliente responde SÍ/NO"  
        echo "3️⃣ Si SÍ → SMS automático con encuesta"
        echo "4️⃣ Si NO → Lista negra (no volver a llamar)"
        echo ""
        
        python3 scripts/sistema_leads_avanzado.py "${{ matrix.ciudad }}" "${{ matrix.sector }}" --llamadas --limite ${{ matrix.llamadas_limite }} --presupuesto-max ${{ matrix.presupuesto_max }}
        
        echo "✅ Llamadas completadas: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}

  # ===== LLAMADAS EXTRA WEEKEND (Solo fines de semana) =====
  llamadas-extra-weekend:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 12 * * 6,0'  # Solo sábados y domingos 12:00
    
    strategy:
      matrix:
        include:
          # Ciudades adicionales para fines de semana - SOLO LLAMADAS
          - ciudad: "Toledo"
            sector: "dentistas"
            limite: "3"
          - ciudad: "Cáceres" 
            sector: "peluquerias"
            limite: "3"
          - ciudad: "Badajoz"
            sector: "restaurantes"
            limite: "4"
          - ciudad: "Cuenca"
            sector: "abogados"
            limite: "3"
          - ciudad: "Soria"
            sector: "psicologos"
            limite: "2"
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml python-telegram-bot twilio openai python-dotenv vonage
    
    - name: 📞 Ejecutar llamadas weekend ${{ matrix.ciudad }} - ${{ matrix.sector }}
      run: |
        echo "📞 WEEKEND LLAMADAS: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
        echo "🎯 Límite: ${{ matrix.limite }} llamadas"
        echo "🎉 Campaña de fin de semana - DesArroyo Tech"
        echo ""
        
        python3 scripts/sistema_leads_avanzado.py "${{ matrix.ciudad }}" "${{ matrix.sector }}" --llamadas --limite ${{ matrix.limite }}
        
        echo "✅ Llamadas weekend completadas: ${{ matrix.ciudad }} - ${{ matrix.sector }}"
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}

  # ===== REPORTE Y CONTROL DE PRESUPUESTO =====
  control-presupuesto:
    needs: [llamadas-conversacionales]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests python-telegram-bot python-dotenv vonage
    
    - name: 📊 Control presupuesto llamadas
      run: |
        echo "📊 CONTROL DE PRESUPUESTO LLAMADAS"
        echo "Calculando gastos de llamadas conversacionales..."
        echo "💰 Objetivo mensual: Máximo €100"
        echo "📞 Coste por llamada: €0.08-0.15"
        python3 scripts/control_presupuesto.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: ✅ Notificar llamadas completadas
      run: |
        echo "🎉 LLAMADAS CONVERSACIONALES COMPLETADAS"
        echo "📞 Sistema de demostración DesArroyo Tech ejecutado"
        echo "⏰ Fecha: $(date)"
        echo "🔄 Próximas llamadas en 8 horas"
        echo "💰 Sistema optimizado para máximo €100/mes"
        echo "🎯 Conversión esperada: 40% de llamadas → SÍ → SMS automático"
        echo "🚀 Cada llamada demuestra la tecnología de DesArroyo Tech" 