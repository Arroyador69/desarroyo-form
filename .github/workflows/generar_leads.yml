name: 🚀 Sistema de Leads Automático - DesArroyo Tech

on:
  # Ejecutar cada 6 horas
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas
  
  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      ciudad:
        description: 'Ciudad a buscar'
        required: false
        default: 'Madrid'
      sector:
        description: 'Sector a buscar'
        required: false
        default: 'restaurantes'

jobs:
  generar-leads:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml selenium python-telegram-bot twilio openai
    
    - name: 🔧 Configurar permisos
      run: chmod +x scripts/scraper_gratis.py
    
    - name: 🔍 Ejecutar scraping Madrid - Restaurantes
      run: python3 scripts/sistema_leads_avanzado.py Madrid restaurantes
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 🔍 Ejecutar scraping Barcelona - Peluquerías
      run: python3 scripts/sistema_leads_avanzado.py Barcelona peluquerias
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 🔍 Ejecutar scraping Valencia - Dentistas
      run: python3 scripts/sistema_leads_avanzado.py Valencia dentistas
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        BUSINESS_NAME: ${{ secrets.BUSINESS_NAME }}
        YOUR_NAME: ${{ secrets.YOUR_NAME }}
    
    - name: 📊 Generar reporte diario
      run: python3 scripts/generar_reporte.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: ✅ Notificar ejecución completada
      run: |
        echo "🎉 Sistema de leads ejecutado correctamente"
        echo "⏰ Fecha: $(date)"
        echo "🎯 Próxima ejecución en 6 horas" 
        echo "🚀 SISTEMA ACTUALIZADO CON NUEVOS PRECIOS Y VALIDACIÓN" 