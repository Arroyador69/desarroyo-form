    @keyframes float {

<body>
  <!-- Partículas de fondo -->

      <!-- Título principal -->

      <p style="font-size: 1.2rem; color: #b8c5d1; margin-bottom: 3rem; max-width: 600px;">

  <script>
    // Datos de shortcuts reales con enlaces de iCloud
    const shortcutsData = [
      {
        id: 1,
        title: "Scanner de Documentos",
        description: "Escanea documentos, facturas y textos con la cámara de tu iPhone. Convierte automáticamente a PDF y comparte fácilmente.",
        icon: "📄",
        features: ["Escaneo automático", "Conversión a PDF", "Compartir fácilmente", "Organización inteligente"],
        badge: "nuevo",
        downloadUrl: "https://www.icloud.com/shortcuts/e5d51eab436044faa62f9402d5f96195",
        qrCode: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.icloud.com/shortcuts/e5d51eab436044faa62f9402d5f96195"
      },
      {
        id: 2,
        title: "Añadir Alarma Rápida",
        description: "Crea alarmas de forma rápida y eficiente. Configura múltiples alarmas con un solo toque.",
        icon: "⏰",
        features: ["Configuración rápida", "Múltiples alarmas", "Personalización", "Sincronización iCloud"],
        badge: "popular",
        downloadUrl: "https://www.icloud.com/shortcuts/116bd99c22d04b3190d9dc498b635564",
        qrCode: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.icloud.com/shortcuts/116bd99c22d04b3190d9dc498b635564"
      },
      {
        id: 3,
        title: "Hacer Foto",
        description: "Haz una foto al instante usando solo tu voz. Perfecto para capturar momentos rápidamente sin tocar el móvil, ideal cuando tienes las manos ocupadas o quieres máxima comodidad.",
        icon: "📷",
        features: ["Activación por voz", "Foto instantánea", "Sin desbloquear el móvil", "Súper rápido y práctico"],
        badge: "nuevo",
        downloadUrl: "https://www.icloud.com/shortcuts/cd85160cc02d4f8c8b967a679760a59b",
        qrCode: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.icloud.com/shortcuts/cd85160cc02d4f8c8b967a679760a59b"
      },
      {
        id: 4,
        title: "Abrir Ruta en Coche",
        description: "Abre la ruta en coche a tu destino usando solo tu voz, sin distracciones. Súper útil si vas conduciendo y necesitas que el iPhone te guíe sin apartar la vista de la carretera.",
        icon: "🚗",
        features: ["Activación por voz", "Navegación inmediata", "Seguridad al volante", "Compatible con Mapas"],
        badge: "nuevo",
        downloadUrl: "https://www.icloud.com/shortcuts/43902da8fb1447f8ac51a2635909593d",
        qrCode: "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.icloud.com/shortcuts/43902da8fb1447f8ac51a2635909593d"
      }
    ];

    // Generar partículas de fondo
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    // Renderizar shortcuts
    function renderShortcuts() {
      const grid = document.getElementById('shortcutsGrid');
      grid.innerHTML = '';

      shortcutsData.forEach(shortcut => {
        const card = document.createElement('div');
        card.className = 'shortcut-card';
        
        const badgeClass = shortcut.badge ? `badge ${shortcut.badge}` : '';
        const badgeText = shortcut.badge ? shortcut.badge.toUpperCase() : '';
        
        card.innerHTML = `
          <span class="shortcut-icon">${shortcut.icon}</span>
          <h2 class="shortcut-title">
            ${shortcut.title} ${badgeText ? `<span class="${badgeClass}">${badgeText}</span>` : ''}
          </h2>
          <p class="shortcut-description">${shortcut.description}</p>
          <ul class="shortcut-features">
            ${shortcut.features.map(feature => `<li>${feature}</li>`).join('')}
          </ul>
          
          <!-- QR Code y Enlaces -->
          <div class="shortcut-actions">
            <div class="qr-section">
              <img src="${shortcut.qrCode}" 
                   alt="QR ${shortcut.title}" 
                   class="qr-code">
              <p class="qr-text">¡ESCANEA EL SUPERPODER!</p>
            </div>
            
            <div class="download-section">
              <a href="${shortcut.downloadUrl}" 
                 target="_blank" 
                 class="shortcut-btn">
                📱 Instalar en iPhone
              </a>
              <p class="download-info">Toca para abrir en la app Shortcuts</p>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    // Función para descargar shortcut
    function downloadShortcut(id) {
      const shortcut = shortcutsData.find(s => s.id === id);
      if (shortcut) {
        console.log(`Abriendo shortcut: ${shortcut.title}`);
        
        // Abrir enlace de iCloud en nueva pestaña
        window.open(shortcut.downloadUrl, '_blank');
      }
    }

    // Inicializar cuando se carga la página
    document.addEventListener('DOMContentLoaded', function() {
      createParticles();
      
      // Simular carga de datos
      setTimeout(() => {
        renderShortcuts();
      }, 1000);
      
      // Añadir efecto de hover a las tarjetas
      document.addEventListener('mouseover', function(e) {
        if (e.target.closest('.shortcut-card')) {
          const card = e.target.closest('.shortcut-card');
          card.style.transform = 'translateY(-5px) scale(1.02)';
        }
      });
      
      document.addEventListener('mouseout', function(e) {
        if (e.target.closest('.shortcut-card')) {
          const card = e.target.closest('.shortcut-card');
          card.style.transform = 'translateY(0) scale(1)';
        }
      });
    });

    // Efecto de typing en el título
    function typeWriter(element, text, speed = 100) {
      let i = 0;
      element.innerHTML = '';
      
      function type() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    // Aplicar efecto de typing al título principal
    document.addEventListener('DOMContentLoaded', function() {
      const title = document.querySelector('h1');
      const originalText = title.textContent;
      typeWriter(title, originalText, 50);
    });
  </script>
</body>
